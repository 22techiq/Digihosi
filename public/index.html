<style>
:root{
  --primary:#0a84ff;
  --secondary:#35c8ff;
  --dark:#04111f;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
  min-height:100%;
}

body{
  font-family:"Poppins",sans-serif;
  background:linear-gradient(135deg,#04111f,#0a4f98,#1588ff);
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
  overflow-x:hidden;
  position:relative;
}

/* Background glow */
body::before,
body::after{
  content:"";
  position:absolute;
  border-radius:50%;
  filter:blur(90px);
  z-index:0;
}

body::before{
  width:260px;
  height:260px;
  background:#39d4ff;
  top:-80px;
  left:-80px;
  animation:float 10s ease-in-out infinite;
}

body::after{
  width:320px;
  height:320px;
  background:#006dff;
  bottom:-100px;
  right:-100px;
  animation:float 12s ease-in-out infinite reverse;
}

@keyframes float{
  50%{
    transform:translateY(30px) scale(1.08);
  }
}

.card{
  position:relative;
  z-index:1;
  width:min(680px,100%);
  background:rgba(255,255,255,.12);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  border:1px solid rgba(255,255,255,.18);
  border-radius:28px;
  padding:clamp(28px,5vw,52px);
  text-align:center;
  color:#fff;
  box-shadow:0 25px 60px rgba(0,0,0,.35);
}

.badge{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:10px 18px;
  border-radius:999px;
  background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.15);
  font-size:clamp(.8rem,2vw,.95rem);
  font-weight:600;
}

.icon{
  font-size:clamp(52px,10vw,72px);
  margin:22px 0 10px;
  animation:pulse 2s infinite;
}

@keyframes pulse{
  50%{transform:scale(1.08);}
}

h1{
  font-size:clamp(2rem,6vw,3rem);
  line-height:1.1;
  font-weight:800;
  margin-bottom:14px;
}

.divider{
  width:80px;
  height:4px;
  margin:0 auto 24px;
  border-radius:10px;
  background:linear-gradient(90deg,var(--secondary),#fff);
}

p{
  color:rgba(255,255,255,.88);
  line-height:1.8;
  font-size:clamp(.95rem,2.4vw,1.05rem);
  margin-bottom:30px;
}

.contact{
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.12);
  border-radius:18px;
  padding:22px;
}

.contact h3{
  font-size:1.2rem;
  margin-bottom:8px;
}

.contact small{
  display:block;
  color:rgba(255,255,255,.72);
  margin-bottom:18px;
}

.buttons{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:14px;
}

.btn{
  text-decoration:none;
  color:white;
  font-weight:600;
  padding:14px 18px;
  border-radius:14px;
  background:linear-gradient(135deg,var(--secondary),var(--primary));
  transition:.3s;
  box-shadow:0 10px 25px rgba(0,110,255,.35);
}

.btn:hover{
  transform:translateY(-3px);
  box-shadow:0 18px 35px rgba(0,110,255,.45);
}

.footer{
  margin-top:24px;
  color:rgba(255,255,255,.7);
  font-size:.9rem;
}

.footer strong{
  color:white;
}

/* Small phones */
@media (max-width:480px){
  body{
    padding:16px;
  }

  .card{
    border-radius:22px;
  }

  .contact{
    padding:18px;
  }

  .btn{
    padding:13px;
  }
}

/* Very short screens */
@media (max-height:650px){
  body{
    align-items:flex-start;
    padding-top:24px;
    padding-bottom:24px;
  }
}
</style>
</head>
